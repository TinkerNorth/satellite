# OSV-Scanner configuration for satellite.
#
# Scope: this file only carries [[IgnoredVulns]] entries (mirrored from
# `.security/allowlist.yaml`). The vendored C/C++ under `lib/` and
# `vigem/include/` has no manifest OSV-Scanner can read, so CI names each
# component by the upstream commit its `lib/VENDORED.md` pin resolves to
# (`scripts/vendored-osv-lockfile.sh`) and scans that as an OSV-Scanner
# custom lockfile.
#
# Schema reference:
#   https://google.github.io/osv-scanner/configuration/
#
# Example:
#
#   [[IgnoredVulns]]
#   id = "GHSA-xxxx-xxxx-xxxx"
#   ignoreUntil = 2026-07-01
#   reason = "Not exploitable: see .security/allowlist.yaml"
