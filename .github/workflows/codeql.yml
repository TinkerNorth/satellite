name: CodeQL

# Source-level static analysis for satellite (C++ only).
#
# `cpp` covers all three platform builds. The matrix below picks the Linux
# build because it's the cheapest and exercises the full set of
# core/net/adapters/platform sources via the Linux platform target.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [cpp]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libsodium-dev libcurl4-openssl-dev libopus-dev \
            libayatana-appindicator3-dev libgtk-3-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          # We drive our own cmake build; without this CodeQL warns and falls back.
          build-mode: manual
          # Default + security-extended; surface error-severity findings.
          queries: security-extended,security-and-quality

      # The release preset every Linux lane builds with. Bound `-j`: CodeQL's
      # extractor multiplies per-compile memory, and an unbounded `-j` reads
      # the host core count rather than the runner's share and OOM-kills it
      # (SIGTERM / exit 143). Only the `satellite` target: it compiles every
      # core/net/adapters/platform source CodeQL analyzes, without the test
      # executables that compile those sources again.
      - name: Build (preset release, tray enabled)
        run: |
          cmake --preset release
          cmake --build --preset release --target satellite -j 2

      # Blocking, and the results go to code scanning.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
