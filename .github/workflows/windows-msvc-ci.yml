name: Windows MSVC CI

# The shipping Windows build, on every pull request: what release.yml's
# windows job builds and packages, through the same preset and the same
# scripts, minus the signing secrets. MSVC unlocks control-flow-integrity
# mitigations GCC/binutils MinGW cannot emit:
#   /guard:cf   Control Flow Guard      (forward-edge CFI: validates indirect calls)
#   /CETCOMPAT  Intel CET shadow stack  (backward-edge CFI: validates returns / ROP)
#   /Qspectre   Spectre v1 mitigations
# Dependencies come from vcpkg's x64-windows-static triplet at vcpkg.json's
# builtin-baseline, so their CRT linkage matches the app's /MT
# (MSVC_RUNTIME_LIBRARY MultiThreaded in CMakeLists.txt).
#
# After the build and its checks, the installer job compiles
# SatelliteSetup.exe with scripts/build-installer.ps1 and runs the silent
# install, launch, repair and uninstall round-trip on it, then rebuilds
# satellite.exe with -DSATELLITE_UIACCESS=ON (what a signed release ships)
# and compiles that installer too, to inspect: an unsigned uiAccess
# executable does not start, so that one is checked, not run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  msvc:
    name: Build, test (MSVC + vcpkg, hardened)
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      # The files provider is backed by the actions/cache step below, so a
      # warm run restores static OpenSSL and sentry-native instead of
      # building them from source.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ImageVersion is in the cache key because a runner-image update can
      # bump MSVC, which changes vcpkg's ABI hashes: under a fixed key the
      # cache would go permanently stale (restored but never hit, rebuilt but
      # never saved, since actions/cache does not update an existing key).
      # vcpkg.json carries the baseline, so a baseline bump changes the key
      # too. The directory must exist before vcpkg first writes into it.
      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-bincache | Out-Null
          Add-Content $env:GITHUB_ENV "IMAGE_VERSION=$env:ImageVersion"

      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vcpkg-bincache
          key: vcpkg-bin-${{ runner.os }}-${{ env.IMAGE_VERSION }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**') }}
          # A manifest bump still restores the previous archives: vcpkg keys
          # each package by ABI hash, skips what no longer matches, and
          # rebuilds only the delta, saved under the new key.
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-

      - name: Check out vcpkg at the manifest's baseline
        shell: pwsh
        run: ./scripts/setup-vcpkg.ps1

      - name: Configure (MSVC + vcpkg static, hardened release)
        shell: pwsh
        run: |
          $generator = ./scripts/windows-vs-generator.ps1
          cmake --preset windows-msvc -G $generator

      - name: Build (Release + LTCG)
        shell: pwsh
        run: cmake --build --preset windows-msvc

      - name: Test
        shell: pwsh
        run: ctest --preset windows-msvc

      - name: Verify satellite.exe was produced
        shell: pwsh
        run: |
          if (-not (Test-Path satellite.exe)) { throw "satellite.exe not produced at repo root" }
          if (-not (Test-Path crashpad_handler.exe)) { throw "crashpad_handler.exe was not staged beside satellite.exe" }
          if (-not (Test-Path crashpad_wer.dll)) { throw "crashpad_wer.dll was not staged beside satellite.exe" }
          Get-Item satellite.exe, crashpad_handler.exe, crashpad_wer.dll | Format-List Name, Length, LastWriteTime

      - name: Smoke test the built app
        shell: pwsh
        run: ./scripts/smoke-windows-app.ps1

      # The hardening this lane exists for, read back from the PE: CFG in the
      # DLL characteristics and load config, CET shadow-stack compatibility in
      # the extended characteristics. dumpbin comes from the same toolset
      # vswhere resolves for the generator (scripts/windows-vs-generator.ps1),
      # so a missing dumpbin is a broken image, not a reason to skip.
      - name: Confirm CFG / CET bits
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) { throw "vswhere found no Visual Studio installation with the C++ x64 toolset" }
          $dumpbin = Get-ChildItem -Path (Join-Path $vsRoot "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe") |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $dumpbin) { throw "dumpbin.exe not found under $vsRoot" }
          $headers = & $dumpbin.FullName /headers satellite.exe | Out-String
          $loadconfig = & $dumpbin.FullName /loadconfig satellite.exe | Out-String
          $headers -split "`n" | Select-String -Pattern 'Guard|CET|Control Flow|Shadow' | ForEach-Object { $_.Line }
          $loadconfig -split "`n" | Select-String -Pattern 'Guard|CET|Control Flow|Shadow|Instrumented' | ForEach-Object { $_.Line }
          if ($headers -notmatch 'Control Flow Guard') { throw "satellite.exe was linked without Control Flow Guard (/GUARD:CF)" }
          if ($loadconfig -notmatch 'CF instrumented') { throw "satellite.exe's load config does not carry CF instrumentation (/guard:cf)" }
          if ($headers -notmatch 'CET compatible') { throw "satellite.exe was linked without CET shadow-stack compatibility (/CETCOMPAT)" }

      - name: Upload MSVC artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: satellite-windows-x64-msvc
          path: satellite.exe
          retention-days: 14
          # A missing binary is a failed lane, not a warning annotation.
          if-no-files-found: error

      # From here: the release's installer steps, unsigned.
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Install the pinned Inno Setup
        shell: pwsh
        run: |
          $iscc = ./scripts/install-inno-setup.ps1
          Add-Content $env:GITHUB_ENV "SATELLITE_ISCC=$iscc"

      - name: Build the installer (unsigned)
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Iscc $env:SATELLITE_ISCC

      # The same class of assertions dish-windows runs. Both drivers are
      # skipped (/VIGEM=skip /HIDMAESTRO=skip): a driver install has no
      # business succeeding-or-hanging inside a CI assertion.
      - name: Installer silent round-trip + launch smoke (no UI)
        shell: pwsh
        run: ./scripts/test-installer-roundtrip.ps1 -Setup dist/SatelliteSetup.exe

      # What the installer carries, as the release writes it.
      - name: Components SBOM
        shell: bash
        run: |
          python scripts/write-sbom.py --lane windows \
            --vcpkg-installed build-msvc/vcpkg_installed --out dist/satellite-windows.components.spdx.json
          python scripts/check-sbom.py --lane windows dist/satellite-windows.components.spdx.json

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-windows
          path: |
            dist/SatelliteSetup.exe
            dist/satellite-windows.components.spdx.json
          retention-days: 14
          if-no-files-found: error

      # What a signed release builds: satellite.exe requesting uiAccess and
      # the installer compiled with /DUiAccess=1. Only the link of
      # satellite.exe reruns. Neither can run unsigned, so the check is that
      # both build and that the executable carries the request.
      - name: Rebuild satellite.exe with SATELLITE_UIACCESS=ON
        shell: pwsh
        run: |
          $generator = ./scripts/windows-vs-generator.ps1
          cmake --preset windows-msvc -G $generator -DSATELLITE_UIACCESS=ON
          cmake --build --preset windows-msvc --target satellite
          $exe = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Resolve-Path satellite.exe).Path))
          if (-not $exe.Contains('uiAccess="true"')) { throw 'satellite.exe does not carry uiAccess="true"' }

      - name: Compile the UIAccess installer (inspect only)
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Iscc $env:SATELLITE_ISCC -UiAccess -Unsigned

  # The release's harden job over the installer built above, signed with a
  # throwaway key; see linux-ci.yml's release-dry-run for what a pull request
  # cannot exercise.
  release-dry-run:
    name: Release hardening, dry run (windows)
    needs: [msvc]
    permissions:
      contents: read
    uses: ./.github/workflows/_release_harden.yml
    with:
      artifact-pattern: build-windows
      product: satellite
      dry-run: true
