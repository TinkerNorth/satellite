name: Windows MSVC CI

# Hardened A/B of the Windows binary, built alongside the MinGW windows-ci.yml.
# MSVC unlocks control-flow-integrity mitigations GCC/binutils MinGW cannot emit:
#   /guard:cf   Control Flow Guard      (forward-edge CFI: validates indirect calls)
#   /CETCOMPAT  Intel CET shadow stack  (backward-edge CFI: validates returns / ROP)
#   /Qspectre   Spectre v1 mitigations
# Dependencies come from vcpkg's x64-windows-static triplet so their CRT linkage
# matches the app's /MT (MSVC_RUNTIME_LIBRARY MultiThreaded in CMakeLists.txt).
#
# This job does NOT publish; it proves the hardened build stays green. Promoting
# it to the shipping artifact is a one-job swap in release.yml's `windows` job.
#
# Pin map (checkout/upload-artifact match windows-ci.yml):
#   actions/checkout        @ v7.0.0 → 9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
#   actions/upload-artifact @ v7.0.1 → 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/cache           @ v4.3.0 → 0057852bfaa89a56745cba8c7296529d2fc39830

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    name: Build, test (MSVC + vcpkg, hardened)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # The image's vcpkg ships with no binary cache configured, so every run
      # rebuilt static OpenSSL from source (~6 min of a ~15 min job). The
      # files provider is backed by the actions/cache step below.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ImageVersion is in the cache key because a runner-image update can
      # bump MSVC or the image's own vcpkg checkout, either of which changes
      # vcpkg's ABI hashes: under a fixed key the cache would go permanently
      # stale (restored but never hit, rebuilt but never saved, since
      # actions/cache does not update an existing key). The directory must
      # exist before vcpkg first writes into it.
      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-bincache | Out-Null
          Add-Content $env:GITHUB_ENV "IMAGE_VERSION=$env:ImageVersion"

      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vcpkg-bincache
          key: vcpkg-bin-${{ runner.os }}-${{ env.IMAGE_VERSION }}-${{ hashFiles('vcpkg.json') }}
          # A manifest bump still restores the previous archives: vcpkg keys
          # each package by ABI hash, skips what no longer matches, and
          # rebuilds only the delta, saved under the new key.
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-

      # windows-latest ships VS (MSVC + Spectre-mitigated libs) and a vcpkg
      # checkout at VCPKG_INSTALLATION_ROOT, the same image release.yml builds
      # on. The configure step's vcpkg toolchain auto-installs libsodium,
      # openssl and opus (static) from vcpkg.json, restored from the binary
      # cache above; only a cold cache still builds OpenSSL from source, and
      # the archives that run stores serve every later run on the same image.
      - name: Configure (MSVC + vcpkg static, hardened release)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $generator = ./scripts/windows-vs-generator.ps1
          cmake --preset windows-msvc -G $generator

      - name: Build (Release + LTCG)
        shell: pwsh
        run: cmake --build --preset windows-msvc

      - name: Test
        shell: pwsh
        run: ctest --preset windows-msvc

      - name: Verify satellite.exe was produced
        shell: pwsh
        run: |
          if (-not (Test-Path satellite.exe)) { throw "satellite.exe not produced at repo root" }
          Get-Item satellite.exe | Format-List Name, Length, LastWriteTime

      # Best-effort proof the CFG + CET bits actually landed in the PE header.
      # Informational only; never fails the build (dumpbin location varies).
      - name: Confirm CFG / CET bits (informational)
        shell: pwsh
        continue-on-error: true
        run: |
          $dumpbin = Get-ChildItem -ErrorAction SilentlyContinue -Path `
            "C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe", `
            "C:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Select-Object -First 1
          if ($null -eq $dumpbin) { Write-Host "dumpbin not found; skipping check"; exit 0 }
          & $dumpbin.FullName /headers /loadconfig satellite.exe |
            Select-String -Pattern 'Guard|CET|Control Flow|cfInstrumented|Shadow'

      - name: Upload MSVC artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: satellite-windows-x64-msvc
          path: satellite.exe
          retention-days: 14
