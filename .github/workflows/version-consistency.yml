name: Version consistency

# Fails the pull request when a fact written in more than one place drifts:
# the version and its mirrors, the CHANGELOG heading for it, the bundled
# driver pins, the tool and dependency pins repeated across files, and the
# protocol number and C++ standard the documents name. The checks live in
# scripts/check-version-consistency.sh (its header lists them), which
# scripts/ci-local.sh and release.yml (against the tag) run too. It reads
# the whole tree, so it runs on every pull request rather than on a path
# list that would miss a newly repeated pin.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Version, pins and documented facts agree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare every repeated fact with its source
        run: bash scripts/check-version-consistency.sh
