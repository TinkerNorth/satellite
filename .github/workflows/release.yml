name: Release

on:
  push:
    # Bare MAJOR.MINOR.PATCH tags, the fleet's convention (a prerelease such
    # as 1.2.3-rc.1 matches too and publishes marked as a prerelease).
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

# Every step reads the tag from this variable, never from an expression
# written into a script, so a dispatched tag input cannot inject shell.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

# Builds release artifacts on all three target platforms in parallel, each
# through the script and preset its pull-request lane runs (the lanes are
# named per job below), so what a tag builds has already been built,
# installed and launched on the pull request that changed it:
#
#   * Windows: builds satellite.exe under MSVC + vcpkg (hardened: CFG + CET +
#     Spectre; windows-msvc-ci.yml), then scripts/build-installer.ps1 produces
#     SatelliteSetup.exe, and the silent install/launch/repair/uninstall
#     round-trip proves it (driver skipped via /VIGEM=skip). Code-signed if
#     WIN_SIGN_CERT_BASE64 + WIN_SIGN_PASSWORD are set; signed builds carry
#     the UIAccess manifest and are smoke-tested from Program Files.
#   * macOS:   builds the *stub* satellite.app (no virtual gamepad: no
#     entitled build has shipped) with scripts/package-macos.sh (macos-ci.yml
#     bundle job). Codesigned + notarized if Developer ID secrets are set.
#   * Linux:   packages .deb in a debian:trixie container and .rpm in a
#     fedora:44 container (linux-ci.yml deb and rpm jobs), so each distro's
#     own dependency scanner writes the Depends/Requires (a single
#     Ubuntu-built package gets both wrong), plus an AppImage with zsync
#     self-update metadata on the 22.04 glibc floor (linux-ci.yml appimage
#     job). The .deb and .rpm jobs install their own package and launch it
#     before uploading; nothing else can catch a missing runtime dependency.
#
# Order: the tag is checked against /VERSION and CHANGELOG.md, every PR-time
# check re-runs against the tagged commit (`gates`), the builds run, the
# `harden` job (the shared _release_harden.yml) scans, signs, generates SBOMs
# and produces SHA256SUMS, the release is uploaded as a DRAFT, the
# measurements are attached, and only then is it flipped to published.
# GitHub never points releases/latest at a draft, so the AppImage zsync
# pattern and anyone scripting `releases/latest` see either the old release
# or the complete new one, never a half-uploaded one.
#
# Alongside each versioned artifact, the shipping platforms stage a second
# copy under a version-less STABLE NAME:
#
#   SatelliteSetup.exe   satellite-amd64.deb   satellite-x86_64.rpm
#   satellite-x86_64.AppImage
#
# Those names are a permanent API, exactly like dish-windows' dish-setup.exe:
# https://github.com/TinkerNorth/satellite/releases/latest/download/<name>
# always resolves to the newest published build, which is what lets
# dish-website (and anything else) link "the latest Satellite" without being
# rebuilt for every release. Renaming or dropping one silently breaks every
# consumer of that permalink. The stable copies flow through the same
# harden job, so SHA256SUMS and the cosign signatures cover them too.
#
# Prerelease tags (1.2.3-rc.1) publish marked as prerelease and skip the
# APT/DNF/pacman repos; package managers never see them.
#
#   (scan/SBOM/cosign pins live in _release_harden.yml)

# Least privilege at the top; each job widens only what it needs. A workflow
# grant is a ceiling for the jobs AND for any reusable workflow they call.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # The tag names the version the tree says it is. A tag pushed on the
  # wrong commit, or before the bump PR merged, stops here, before any
  # artifact is built.
  # ─────────────────────────────────────────────────────────────────────
  tag-version:
    name: Tag matches VERSION and CHANGELOG
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Compare the tag with /VERSION and the CHANGELOG heading
        run: bash scripts/check-version-consistency.sh --tag "$TAG"

  # ─────────────────────────────────────────────────────────────────────
  # Re-run all PR-time gates against the tagged commit. If any of these
  # fail, none of the build / sign / publish jobs run.
  # ─────────────────────────────────────────────────────────────────────
  gates:
    name: PR-time gates against tag
    needs: [tag-version]
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_security.yml
    with:
      osv_scan_paths: .
      osv_lockfile_script: scripts/vendored-osv-lockfile.sh
      dependency_review_enabled: false # pull-request-only, and the Dependency graph is off

  # ─────────────────────────────────────────────────────────────────────
  # Signing-secret report. Advisory by default: missing secrets downgrade
  # the release to -unsigned artifacts rather than failing it. Set the
  # repository variable ENFORCE_RELEASE_SIGNING=true to restore the hard
  # gate once the platform certificates exist.
  # ─────────────────────────────────────────────────────────────────────
  required-secrets:
    name: Required release secrets gate
    needs: [gates]
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      signed: ${{ steps.check.outputs.signed }}
    steps:
      - name: Verify required signing secrets are present for tagged releases
        id: check
        env:
          ENFORCE: ${{ vars.ENFORCE_RELEASE_SIGNING }}
          REF_TYPE: ${{ github.ref_type }}
          WIN_SIGN_CERT_BASE64: ${{ secrets.WIN_SIGN_CERT_BASE64 }}
          WIN_SIGN_PASSWORD: ${{ secrets.WIN_SIGN_PASSWORD }}
          DEVELOPER_ID_APPLICATION_CERT_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in WIN_SIGN_CERT_BASE64 WIN_SIGN_PASSWORD \
                      DEVELOPER_ID_APPLICATION_CERT_BASE64 DEVELOPER_ID_PASSWORD \
                      APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::All platform signing secrets present; artifacts will be signed."
            exit 0
          fi

          echo "signed=false" >> "$GITHUB_OUTPUT"

          if [ "${REF_TYPE}" != "tag" ]; then
            echo "::notice::Dispatched release run; unsigned fallback permitted. Missing: ${missing[*]}"
            exit 0
          fi
          case "$TAG" in
            *-*)
              echo "::warning::Prerelease tag ${TAG}: unsigned artifacts carry an -unsigned suffix. Missing: ${missing[*]}"
              exit 0
              ;;
          esac

          if [ "${ENFORCE:-}" = "true" ]; then
            echo "::error::Stable tagged release ${TAG} requires platform signing secrets, but the following are missing: ${missing[*]}"
            echo "::error::Add the missing repository secrets, or unset the ENFORCE_RELEASE_SIGNING repository variable to allow -unsigned artifacts."
            exit 1
          fi

          echo "::warning::Stable tag ${TAG} is being released UNSIGNED; artifacts carry an -unsigned suffix. Missing: ${missing[*]}"
          echo "::warning::Set the repository variable ENFORCE_RELEASE_SIGNING=true to make this a hard failure once signing certificates are available."

      - name: Report crash-reporting readiness (advisory)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        shell: bash
        run: |
          if [ -z "${SENTRY_DSN:-}" ]; then
            echo "::warning::SENTRY_DSN not set; this release builds with no DSN and sends no crash reports."
          else
            echo "SENTRY_DSN present; release builds carry the DSN."
          fi
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN not set; debug symbols will not be uploaded and native frames stay unsymbolicated."
          else
            echo "SENTRY_AUTH_TOKEN present; debug symbols will be uploaded."
          fi

  # ─────────────────────────────────────────────────────────────────────
  # Per-platform build jobs.
  # ─────────────────────────────────────────────────────────────────────
  windows:
    name: Build Windows
    needs: [gates, required-secrets]
    timeout-minutes: 90
    runs-on: windows-2022
    env:
      WIN_SIGN_CERT_BASE64: ${{ secrets.WIN_SIGN_CERT_BASE64 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Check out vcpkg at the manifest's baseline
        shell: pwsh
        run: ./scripts/setup-vcpkg.ps1

      # The windows-msvc preset windows-msvc-ci.yml builds on every pull
      # request (hardened: CFG + CET + Spectre), plus the release's version,
      # its DSN, and the UIAccess manifest when the build will be signed.
      - name: Build satellite.exe (MSVC + vcpkg, hardened)
        shell: pwsh
        env:
          # Empty for anything but a release from this repo: secrets are not
          # exposed to forks, so a fork build carries no DSN and cannot report.
          SATELLITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          $generator = ./scripts/windows-vs-generator.ps1
          $display = $env:TAG -replace '^v', ''
          $uiAccess = @()
          if ($env:WIN_SIGN_CERT_BASE64) { $uiAccess = @('-DSATELLITE_UIACCESS=ON') }
          cmake --preset windows-msvc -G $generator -DSATELLITE_RELEASE_VERSION="$display" -DSATELLITE_SENTRY_DSN="$env:SATELLITE_SENTRY_DSN" @uiAccess
          cmake --build --preset windows-msvc --target satellite
          if (-not (Test-Path satellite.exe)) { throw "MSVC build did not produce satellite.exe at repo root" }
          if (-not (Test-Path crashpad_handler.exe)) { throw "crashpad_handler.exe was not staged beside satellite.exe" }
          if (-not (Test-Path crashpad_wer.dll)) { throw "crashpad_wer.dll was not staged beside satellite.exe" }

      - name: Upload debug symbols to Sentry
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: bash scripts/sentry-cli.sh upload-symbols satellite.exe satellite.pdb

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Install the pinned Inno Setup
        shell: pwsh
        run: |
          $iscc = ./scripts/install-inno-setup.ps1
          Add-Content $env:GITHUB_ENV "SATELLITE_ISCC=$iscc"

      # scripts/build-installer.ps1, as windows-msvc-ci.yml runs it: fetch and
      # verify the redistributables, publish the HIDMaestro helper and hold
      # it to driver_pins.h, sign the four binaries (when the certificate is
      # configured), compile the installer, sign it.
      - name: Build the installer
        shell: pwsh
        env:
          SATELLITE_SIGN_PFX_PASSWORD: ${{ secrets.WIN_SIGN_PASSWORD }}
        run: |
          $uiAccess = @{}
          if ($env:WIN_SIGN_CERT_BASE64) {
            $cert = Join-Path $env:RUNNER_TEMP "code-sign.pfx"
            [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WIN_SIGN_CERT_BASE64))
            $env:SATELLITE_SIGN_PFX = $cert
            $uiAccess = @{ UiAccess = $true }
          }
          ./scripts/build-installer.ps1 -Iscc $env:SATELLITE_ISCC @uiAccess

      # The same class of assertions dish-windows runs, against the artifact
      # that is about to be published rather than a rebuild of it. Both
      # drivers are skipped (/VIGEM=skip /HIDMAESTRO=skip): a driver install
      # has no business succeeding-or-hanging inside a CI assertion.
      - name: Installer silent round-trip + launch smoke (no UI)
        shell: pwsh
        run: ./scripts/test-installer-roundtrip.ps1 -Setup dist/SatelliteSetup.exe -UiAccess:([bool]$env:WIN_SIGN_CERT_BASE64)

      - name: Stage
        run: |
          suffix=""
          if [ -z "${WIN_SIGN_CERT_BASE64:-}" ]; then
            suffix="-unsigned"
          fi
          mkdir -p stage
          cp dist/SatelliteSetup.exe "stage/SatelliteSetup-${TAG}${suffix}.exe"
          # Stable-name copy: the /releases/latest/download/ permalink target.
          # Never carries the version or the -unsigned suffix; the download
          # pages declare signing state per product instead of via filename.
          cp dist/SatelliteSetup.exe stage/SatelliteSetup.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-windows
          path: stage/
          if-no-files-found: error

  macos:
    name: Build macOS (stub)
    needs: [gates, required-secrets]
    timeout-minutes: 45
    # macos-15 with Xcode 16.4 named: see macos-ci.yml for why this is not
    # macos-26 (the bundle's floor would move to macOS 26).
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install dependencies
        run: |
          for formula in cmake pkg-config libsodium opus create-dmg; do
            brew list --versions "$formula" > /dev/null 2>&1 || brew install "$formula"
          done

      - name: Build satellite.app (stub, preset package)
        env:
          # Empty for anything but a release from this repo: secrets are not
          # exposed to forks, so a fork build carries no DSN and cannot report.
          SATELLITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: SATELLITE_VERSION="$TAG" bash scripts/package-macos.sh build

      - name: Sign + notarize (if Developer ID configured)
        id: sign
        env:
          CERT_B64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERT_PW: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "${CERT_B64}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Developer ID cert not configured; satellite.app will be uploaded unsigned."
            exit 0
          fi
          KEYCHAIN="${RUNNER_TEMP}/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          echo "${CERT_B64}" | base64 -d > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN}" -P "${CERT_PW}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "${KEYCHAIN}" "$(security list-keychains -d user | tr -d '"')"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PW}" "${KEYCHAIN}" >/dev/null
          IDENTITY=$(security find-identity -v -p codesigning "${KEYCHAIN}" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          codesign --force --options runtime --timestamp --sign "${IDENTITY}" --deep satellite.app
          codesign --verify --strict --deep --verbose=2 satellite.app
          ditto -c -k --keepParent satellite.app "${RUNNER_TEMP}/satellite.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/satellite.zip" \
            --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" --wait
          xcrun stapler staple satellite.app
          xcrun stapler validate satellite.app
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Stage the .dmg and .zip
        env:
          SIGN_PRESENT: ${{ steps.sign.outputs.present }}
        run: |
          suffix=""
          if [ "${SIGN_PRESENT}" != "true" ]; then
            suffix="-unsigned"
          fi
          bash scripts/package-macos.sh stage "$TAG" "$suffix"

      - name: Mount the .dmg and run its app
        run: bash scripts/package-macos.sh check

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-macos
          path: stage/
          if-no-files-found: error

  # =========================================================================
  # .deb: built in a debian:trixie container so dpkg-shlibdeps computes the
  # Depends against Debian's own sonames. The previous single-host build
  # emitted Ubuntu `t64` package names in Depends, which resolve on no Debian
  # release; CPACK_DEBIAN_PACKAGE_SHLIBDEPS reads the build host, so the
  # build host has to be the target distro. The scripts are linux-ci.yml's
  # deb job's.
  # =========================================================================
  deb:
    name: Build .deb (Debian 13)
    needs: [gates, required-secrets]
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 30
    # A container job's default shell is `sh`; every step here assumes bash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install build and packaging dependencies
        run: bash scripts/install-package-deps.sh deb

      - name: Build the .deb
        env:
          # Empty for anything but a release from this repo: secrets are not
          # exposed to forks, so a fork build carries no DSN and cannot report.
          SATELLITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: SATELLITE_VERSION="$TAG" bash scripts/build-deb.sh

      # The unstripped binary at the repo root; cpack strips only its staged
      # copy.
      - name: Upload debug symbols to Sentry
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: bash scripts/sentry-cli.sh upload-symbols satellite

      - name: Check, install and launch the .deb
        run: bash scripts/check-package.sh deb "$(ls dist/satellite_*_amd64.deb)"

      # Stable-name copy for the /releases/latest/download/ permalink; the
      # dash (vs the versioned name's underscores) keeps it clear of the
      # satellite_*_amd64.deb glob above.
      - name: Stage stable-name alias
        run: cp dist/satellite_*_amd64.deb dist/satellite-amd64.deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-deb
          path: dist/*.deb
          if-no-files-found: error

  # =========================================================================
  # .rpm: same reasoning in a fedora:44 container; rpmbuild's soname scanner
  # writes the Requires against Fedora's packages. linux-ci.yml's rpm job.
  # =========================================================================
  rpm:
    name: Build .rpm (Fedora 44)
    needs: [gates, required-secrets]
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install build and packaging dependencies
        run: bash scripts/install-package-deps.sh rpm

      - name: Build the .rpm
        env:
          # Empty for anything but a release from this repo: secrets are not
          # exposed to forks, so a fork build carries no DSN and cannot report.
          SATELLITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: SATELLITE_VERSION="$TAG" bash scripts/build-rpm.sh

      - name: Upload debug symbols to Sentry
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: bash scripts/sentry-cli.sh upload-symbols satellite

      - name: Check, install and launch the .rpm
        run: bash scripts/check-package.sh rpm "$(ls dist/satellite-*.x86_64.rpm)"

      # Stable-name copy for the /releases/latest/download/ permalink.
      - name: Stage stable-name alias
        run: cp dist/satellite-*.x86_64.rpm dist/satellite-x86_64.rpm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-rpm
          path: dist/*.rpm
          if-no-files-found: error

  # =========================================================================
  # AppImage: every other distro. ubuntu-22.04 because an AppImage's floor is
  # the glibc it linked against, and 22.04's 2.35 covers every supported
  # desktop. linux-ci.yml's appimage job.
  # =========================================================================
  appimage:
    name: Build AppImage
    needs: [gates, required-secrets]
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install dependencies
        run: bash scripts/install-package-deps.sh appimage

      # The whole recipe (build, linuxdeploy, content check, zsync
      # normalisation, stable-name copy) lives in scripts/build-appimage.sh
      # so a local AppImage and the released one come off the same path.
      - name: Build AppImage
        env:
          # Empty for anything but a release from this repo: secrets are not
          # exposed to forks, so a fork build carries no DSN and cannot report.
          SATELLITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: SATELLITE_VERSION="$TAG" bash scripts/build-appimage.sh

      - name: The AppImage stays up headless
        run: bash scripts/smoke-alive.sh "${RUNNER_TEMP}/appimage-content/squashfs-root/AppRun" 45

      - name: Upload debug symbols to Sentry
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: bash scripts/sentry-cli.sh upload-symbols satellite

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-appimage
          path: stage/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────
  # harden: the shared reusable (scan, SBOMs, SHA256SUMS, cosign keyless).
  # Canonical copy of _release_harden.yml lives in this repo.
  # ─────────────────────────────────────────────────────────────────────
  harden:
    name: Harden artifacts
    needs: [windows, macos, deb, rpm, appimage]
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/_release_harden.yml
    with:
      artifact-pattern: build-*
      product: satellite

  # ─────────────────────────────────────────────────────────────────────
  # SLSA L3 provenance generation. The reusable workflow runs in its own
  # privileged context (id-token: write) and emits an .intoto.jsonl
  # attestation pinned to the harden job's output hashes.
  # ─────────────────────────────────────────────────────────────────────
  provenance:
    name: SLSA L3 provenance
    needs: [harden]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.harden.outputs.hashes }}
      provenance-name: satellite.intoto.jsonl
      upload-assets: false
      # A SHA-pinned call cannot resolve the prebuilt builder's release, so
      # the binary never downloads and the generator dies at exit 127; build
      # it from source instead. 1.0.0 shipped with this flag for a reason.
      compile-generator: true

  # ─────────────────────────────────────────────────────────────────────
  # draft: attach hardened bundle + SLSA provenance to a draft GitHub
  # Release. measurements adds its report and gates the release; publish
  # flips the draft to published once every asset is in place: atomic for
  # the zsync pattern and anyone scripting releases/latest.
  # ─────────────────────────────────────────────────────────────────────
  draft:
    name: Upload the draft GitHub Release
    needs: [harden, provenance]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download hardened bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release

      - name: Download SLSA provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: release

      - name: Show what we're about to publish
        run: find release -type f -printf '%p\n'

      - name: Upload to GitHub Releases (as draft)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          body: "Code signing policy: https://github.com/TinkerNorth/satellite#code-signing-policy"
          draft: true
          files: release/**/*
          fail_on_unmatched_files: true

  measurements:
    name: Release measurements
    needs: [draft]
    permissions:
      contents: write
    uses: ./.github/workflows/measurements.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}
      upload_to_release: true
      tag: ${{ inputs.tag || github.ref_name }}

  publish:
    name: Publish to GitHub Releases
    needs: [draft, measurements]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Flip release from draft to published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          [ "$draft" = "false" ] || { echo "::error::release is still a draft"; exit 1; }

  sentry-release:
    name: Create the Sentry release
    needs: [publish]
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create the release and associate commits
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: bash scripts/sentry-cli.sh release "satellite@${TAG#v}"

  repos:
    name: Publish package repositories
    needs: [publish]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-repos.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
