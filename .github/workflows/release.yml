name: Release

on:
  push:
    # Bare MAJOR.MINOR.PATCH tags: org convention for the product repos,
    # because dish-android's pipeline requires bare tags. Every version
    # consumer below still tolerates a legacy v prefix by stripping it.
    tags: ["[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

# Builds release artifacts on all three target platforms in parallel:
#
#   * Windows: builds satellite.exe under MSVC + vcpkg (hardened: CFG + CET +
#     Spectre), then runs Inno Setup to produce SatelliteSetup.exe, and proves
#     the installer with a silent install/launch/repair/uninstall round-trip
#     (driver skipped via /VIGEM=skip). Code-signed if WIN_SIGN_CERT_BASE64 +
#     WIN_SIGN_PASSWORD are set.
#   * macOS:   builds the *stub* satellite.app (no virtual gamepad; see
#     README "How it works"). Codesigned + notarized if Developer ID secrets
#     are set.
#   * Linux:   packages .deb in a debian:trixie container and .rpm in a
#     fedora:42 container, so each distro's own dependency scanner writes the
#     Depends/Requires (a single Ubuntu-built package gets both wrong), plus
#     an AppImage with zsync self-update metadata on the 22.04 glibc floor.
#     The .deb and .rpm jobs install their own package and launch it before
#     uploading; nothing else can catch a missing runtime dependency.
#
# Before any artifact is uploaded, the `gates` job re-runs every PR-time
# check (action-pin lint, allowlist expiry, OSV-Scanner, gitleaks) against
# the tagged commit. The `harden` job (the shared _release_harden.yml) then
# scans, signs, generates SBOMs, and produces SHA256SUMS.
#
# Alongside each versioned artifact, the shipping platforms stage a second
# copy under a version-less STABLE NAME:
#
#   SatelliteSetup.exe   satellite-amd64.deb   satellite-x86_64.rpm
#   satellite-x86_64.AppImage
#
# Those names are a permanent API, exactly like dish-windows' dish-setup.exe:
# https://github.com/TinkerNorth/satellite/releases/latest/download/<name>
# always resolves to the newest published build, which is what lets
# dish-website (and anything else) link "the latest Satellite" without being
# rebuilt for every release. Renaming or dropping one silently breaks every
# consumer of that permalink. The stable copies flow through the same
# harden job, so SHA256SUMS and the cosign signatures cover them too.
#
# The release is uploaded as a DRAFT and flipped to published afterwards:
# GitHub never points releases/latest at a draft, so the AppImage zsync
# pattern and anyone scripting `releases/latest` see either the old release
# or the complete new one, never a half-uploaded one.
#
# Prerelease tags (1.2.3-rc.1) publish marked as prerelease and skip the
# APT/DNF repos; package managers never see them.
#
# Pin map (verify with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`):
#   actions/checkout                @ v7.0.0  → 9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
#   actions/setup-dotnet            @ v6.0.0  → a98b56852c35b8e3190ac28c8c2271da59106c68
#   actions/upload-artifact         @ v7.0.1  → 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact       @ v8.0.1  → 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
#   softprops/action-gh-release     @ v3.0.2  → 3d0d9888cb7fd7b750713d6e236d1fcb99157228
#   slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml
#                                   @ v2.1.0  → f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
#   (scan/SBOM/cosign pins live in _release_harden.yml)

# Least privilege at the top; each job widens only what it needs. A workflow
# grant is a ceiling for the jobs AND for any reusable workflow they call.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Re-run all PR-time gates against the tagged commit. If any of these
  # fail, none of the build / sign / publish jobs run.
  # ─────────────────────────────────────────────────────────────────────
  gates:
    name: PR-time gates against tag
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    uses: ./.github/workflows/_security.yml
    with:
      osv_scan_paths: |
        lib
        vigem/include
      osv_config: osv-scanner.toml
      gitleaks_enabled: true
      dependency_review_enabled: false # PR-only by definition
      action_pin_lint_enabled: true
      allowlist_expiry_enabled: true

  # ─────────────────────────────────────────────────────────────────────
  # Signing-secret report. Advisory by default: missing secrets downgrade
  # the release to -unsigned artifacts rather than failing it. Set the
  # repository variable ENFORCE_RELEASE_SIGNING=true to restore the hard
  # gate once the platform certificates exist.
  # ─────────────────────────────────────────────────────────────────────
  required-secrets:
    name: Required release secrets gate
    needs: [gates]
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      signed: ${{ steps.check.outputs.signed }}
    steps:
      - name: Verify required signing secrets are present for tagged releases
        id: check
        env:
          ENFORCE: ${{ vars.ENFORCE_RELEASE_SIGNING }}
          WIN_SIGN_CERT_BASE64: ${{ secrets.WIN_SIGN_CERT_BASE64 }}
          WIN_SIGN_PASSWORD: ${{ secrets.WIN_SIGN_PASSWORD }}
          DEVELOPER_ID_APPLICATION_CERT_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in WIN_SIGN_CERT_BASE64 WIN_SIGN_PASSWORD \
                      DEVELOPER_ID_APPLICATION_CERT_BASE64 DEVELOPER_ID_PASSWORD \
                      APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::All platform signing secrets present; artifacts will be signed."
            exit 0
          fi

          echo "signed=false" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref_type }}" != "tag" ] || ! [[ "$GITHUB_REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::notice::Non-tag release run; unsigned fallback permitted. Missing: ${missing[*]}"
            exit 0
          fi
          case "$GITHUB_REF_NAME" in
            *-*)
              echo "::warning::Prerelease tag ${GITHUB_REF_NAME}: unsigned artifacts carry an -unsigned suffix. Missing: ${missing[*]}"
              exit 0
              ;;
          esac

          if [ "${ENFORCE:-}" = "true" ]; then
            echo "::error::Stable tagged release on $GITHUB_REF requires platform signing secrets, but the following are missing: ${missing[*]}"
            echo "::error::Add the missing repository secrets, or unset the ENFORCE_RELEASE_SIGNING repository variable to allow -unsigned artifacts."
            exit 1
          fi

          echo "::warning::Stable tag ${GITHUB_REF_NAME} is being released UNSIGNED; artifacts carry an -unsigned suffix. Missing: ${missing[*]}"
          echo "::warning::Set the repository variable ENFORCE_RELEASE_SIGNING=true to make this a hard failure once signing certificates are available."

  # ─────────────────────────────────────────────────────────────────────
  # Per-platform build jobs.
  # ─────────────────────────────────────────────────────────────────────
  windows:
    name: Build Windows
    needs: [gates, required-secrets]
    timeout-minutes: 60
    runs-on: windows-latest
    env:
      WIN_SIGN_CERT_BASE64: ${{ secrets.WIN_SIGN_CERT_BASE64 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      # MSVC build (hardened: CFG + CET + Spectre). Dependencies come from
      # vcpkg's static triplet so their CRT linkage matches the app's /MT.
      # windows-latest ships VS (+ Spectre-mitigated libs) and a vcpkg
      # checkout; windows-msvc-ci.yml A/B-validates this same path on every PR.
      - name: Build satellite.exe (MSVC + vcpkg, hardened)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $generator = ./scripts/windows-vs-generator.ps1
          $disp = ("${{ inputs.tag || github.ref_name }}") -replace '^v',''
          cmake --preset windows-msvc -G $generator -DSATELLITE_RELEASE_VERSION="$disp"
          cmake --build --preset windows-msvc --target satellite
          if (-not (Test-Path satellite.exe)) { throw "MSVC build did not produce satellite.exe at repo root" }

      # installer.iss bundles the ViGEmBus driver and the HIDMaestro helper,
      # neither of which is committed -- fetch + hash-verify them first (the
      # documented `pwsh scripts/fetch-redist.ps1 ; dotnet publish ; iscc`
      # recipe).
      - name: Fetch pinned redistributables (ViGEmBus + HIDMaestro)
        shell: pwsh
        run: pwsh scripts/fetch-redist.ps1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build HIDMaestro helper (dotnet publish)
        shell: pwsh
        run: |
          dotnet publish helper/hidmaestro/satellite-hm-helper.csproj -c Release
          if (-not (Test-Path "helper/hidmaestro/bin/Release/net10.0-windows10.0.26100.0/win-x64/publish/satellite-hm-helper.exe")) {
            throw "dotnet publish did not produce satellite-hm-helper.exe"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Run Inno Setup
        shell: pwsh
        run: |
          $num = (("${{ inputs.tag || github.ref_name }}") -replace '^v','') -replace '[-+].*$',''
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=$num" installer.iss
          if (-not (Test-Path "dist/SatelliteSetup.exe")) {
            throw "iscc did not produce dist/SatelliteSetup.exe"
          }

      - name: Sign installer (if cert configured)
        if: ${{ env.WIN_SIGN_CERT_BASE64 != '' }}
        env:
          WIN_SIGN_PASSWORD: ${{ secrets.WIN_SIGN_PASSWORD }}
        shell: pwsh
        run: |
          $cert = Join-Path $env:RUNNER_TEMP "code-sign.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WIN_SIGN_CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.0.*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) { throw "signtool.exe not found under Windows Kits" }
          & $signtool.FullName sign /f $cert /p $env:WIN_SIGN_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            dist/SatelliteSetup.exe

      # The same class of assertions dish-windows runs, against the artifact
      # that is about to be published rather than a rebuild of it. Both
      # drivers are skipped (/VIGEM=skip /HIDMAESTRO=skip): a driver install
      # has no business succeeding-or-hanging inside a CI assertion.
      - name: Installer silent round-trip + launch smoke (no UI)
        shell: pwsh
        run: ./scripts/test-installer-roundtrip.ps1 -Setup dist/SatelliteSetup.exe

      - name: Stage
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          suffix=""
          if [ -z "${WIN_SIGN_CERT_BASE64:-}" ]; then
            suffix="-unsigned"
          fi
          mkdir -p stage
          cp dist/SatelliteSetup.exe "stage/SatelliteSetup-${tag}${suffix}.exe"
          # Stable-name copy: the /releases/latest/download/ permalink target.
          # Never carries the version or the -unsigned suffix; the download
          # pages declare signing state per product instead of via filename.
          cp dist/SatelliteSetup.exe stage/SatelliteSetup.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-windows
          path: stage/

  macos:
    name: Build macOS (stub)
    needs: [gates, required-secrets]
    timeout-minutes: 30
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install dependencies
        run: brew install cmake pkg-config libsodium opus

      - name: Build satellite.app (stub)
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSATELLITE_RELEASE_VERSION="${tag#v}"
          cmake --build build --config Release --target satellite -j "$(sysctl -n hw.ncpu)"

      - name: Sign + notarize (if Developer ID configured)
        id: sign
        env:
          CERT_B64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERT_PW: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "${CERT_B64}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Developer ID cert not configured; satellite.app will be uploaded unsigned."
            exit 0
          fi
          KEYCHAIN="${RUNNER_TEMP}/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          echo "${CERT_B64}" | base64 -d > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN}" -P "${CERT_PW}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "${KEYCHAIN}" "$(security list-keychains -d user | tr -d '"')"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PW}" "${KEYCHAIN}" >/dev/null
          IDENTITY=$(security find-identity -v -p codesigning "${KEYCHAIN}" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          codesign --force --options runtime --timestamp --sign "${IDENTITY}" --deep satellite.app
          codesign --verify --strict --deep --verbose=2 satellite.app
          ditto -c -k --keepParent satellite.app "${RUNNER_TEMP}/satellite.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/satellite.zip" \
            --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" --wait
          xcrun stapler staple satellite.app
          xcrun stapler validate satellite.app
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build .dmg (create-dmg)
        id: dmg
        env:
          SIGN_PRESENT: ${{ steps.sign.outputs.present }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          suffix=""
          if [ "${SIGN_PRESENT}" != "true" ]; then
            suffix="-unsigned"
          fi
          brew install --quiet create-dmg
          mkdir -p stage
          # `create-dmg` produces a single mountable disk image with the
          # bundle pre-placed and a /Applications symlink: the standard
          # drag-to-Applications experience. The .app inside is already
          # codesigned + notarized + stapled (see the `sign` step above),
          # so the DMG itself only needs to wrap it; Gatekeeper checks
          # the .app at first launch.
          create-dmg \
            --volname "Satellite ${tag}" \
            --window-size 540 360 \
            --icon-size 128 \
            --icon "satellite.app" 130 180 \
            --app-drop-link 410 180 \
            --no-internet-enable \
            "stage/satellite-macos-stub-${tag}${suffix}.dmg" \
            satellite.app

      - name: Stage (legacy .zip alongside the .dmg)
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          suffix=""
          if [ "${{ steps.sign.outputs.present }}" != "true" ]; then
            suffix="-unsigned"
          fi
          mkdir -p stage
          # Keep the .zip around for downloaders that don't deal with
          # .dmg (CI smoke tests, scripts that just want the .app).
          ditto -c -k --sequesterRsrc --keepParent satellite.app \
            "stage/satellite-macos-stub-${tag}${suffix}.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-macos
          path: stage/

  # =========================================================================
  # .deb: built in a debian:trixie container so dpkg-shlibdeps computes the
  # Depends against Debian's own sonames. The previous single-host build
  # emitted Ubuntu `t64` package names in Depends, which resolve on no Debian
  # release; CPACK_DEBIAN_PACKAGE_SHLIBDEPS reads the build host, so the
  # build host has to be the target distro.
  # =========================================================================
  deb:
    name: Build .deb (Debian 13)
    needs: [gates, required-secrets]
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 30
    # A container job's default shell is `sh`; every step here assumes bash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build and packaging dependencies
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            build-essential cmake pkg-config \
            libsodium-dev libssl-dev libcurl4-openssl-dev libopus-dev \
            libayatana-appindicator3-dev libgtk-3-dev libnotify-dev \
            dpkg-dev fakeroot file gzip lintian

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build satellite
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSATELLITE_RELEASE_VERSION="${tag#v}"
          cmake --build build --config Release --target satellite -j "$(nproc)"

      - name: Package (.deb via CPack)
        run: |
          set -euo pipefail
          mkdir -p dist
          cpack -G DEB -B "${RUNNER_TEMP}/cpack" --config build/CPackConfig.cmake
          cp "${RUNNER_TEMP}"/cpack/satellite_*_amd64.deb dist/
          ls -l dist/

      - name: lintian
        run: lintian --fail-on error --tag-display-limit 0 dist/*.deb

      - name: Assert package contents and scriptlets
        run: |
          set -euo pipefail
          contents="$(dpkg-deb -c dist/*.deb)"
          for path in \
            ./usr/bin/satellite \
            ./usr/lib/udev/rules.d/70-satellite-uinput.rules \
            ./usr/lib/modules-load.d/satellite.conf \
            ./usr/share/applications/satellite.desktop \
            ./usr/share/metainfo/io.github.tinkernorth.satellite.metainfo.xml \
            ./usr/share/pixmaps/satellite.png
          do
            grep -qE " ${path}\$" <<<"${contents}" \
              || { echo "::error::${path} missing from the .deb"; exit 1; }
          done
          grep -qE ' \./usr/share/satellite/web/' <<<"${contents}" \
            || { echo "::error::web UI assets missing from the .deb"; exit 1; }
          # Without the reload + modprobe a fresh install cannot open
          # /dev/uinput until the next reboot.
          extract="$(mktemp -d)"
          dpkg-deb -e dist/*.deb "$extract"
          grep -q 'udevadm control' "$extract/postinst" \
            || { echo "::error::.deb postinst carries no udev reload"; exit 1; }
          grep -q 'modprobe uinput' "$extract/postinst" \
            || { echo "::error::.deb postinst carries no modprobe uinput"; exit 1; }

      # Nothing else can stand in for this: unit tests, lints and a contents
      # check all pass against a build tree, and a build tree is exactly what
      # hides a missing runtime dependency.
      - name: Install the package and launch it
        run: |
          set -euo pipefail
          apt-get install -y ./dist/*.deb
          if ldd /usr/bin/satellite | grep -i 'not found'; then
            echo "::error::installed satellite has unresolved shared libraries"
            exit 1
          fi
          # No display and no tray host here: satellite is built to run
          # headless (fallback verified by linux-ci) and to exit 0 on SIGTERM.
          set +e
          satellite >/tmp/launch.log 2>&1 &
          app=$!
          sleep 10
          started=0
          kill -0 "$app" 2>/dev/null && started=1
          if [ "$started" = 1 ]; then
            kill -TERM "$app"
            waited=0
            while [ "$waited" -lt 15 ] && kill -0 "$app" 2>/dev/null; do
              sleep 1
              waited=$((waited + 1))
            done
            kill -0 "$app" 2>/dev/null && kill -KILL "$app"
          fi
          wait "$app"
          rc=$?
          set -e
          cat /tmp/launch.log || true
          if grep -qiE 'error while loading shared libraries|cannot open shared object' /tmp/launch.log; then
            echo "::error::the installed package cannot load its shared libraries"
            exit 1
          fi
          if [ "$started" != 1 ]; then
            echo "::error::satellite exited on its own (${rc}) instead of staying up"
            exit 1
          fi
          if [ "$rc" != 0 ]; then
            echo "::error::satellite did not exit 0 on SIGTERM (got ${rc})"
            exit 1
          fi
          echo "::notice::satellite came up headless, shut down on SIGTERM and exited 0"

      # Stable-name copy for the /releases/latest/download/ permalink; the
      # dash (vs the versioned name's underscores) keeps it clear of the
      # satellite_*_amd64.deb glob above.
      - name: Stage stable-name alias
        run: cp dist/satellite_*_amd64.deb dist/satellite-amd64.deb

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-deb
          path: dist/*.deb
          if-no-files-found: error

  # =========================================================================
  # .rpm: same reasoning in a fedora:42 container; rpmbuild's soname scanner
  # writes the Requires against Fedora's packages.
  # =========================================================================
  rpm:
    name: Build .rpm (Fedora)
    needs: [gates, required-secrets]
    runs-on: ubuntu-24.04
    container: fedora:42
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build and packaging dependencies
        run: |
          set -eux
          dnf -y install --setopt=install_weak_deps=False \
            git-core ca-certificates \
            gcc-c++ cmake make pkgconf-pkg-config rpm-build \
            libsodium-devel openssl-devel libcurl-devel opus-devel \
            gtk3-devel libayatana-appindicator-gtk3-devel libnotify-devel \
            gzip

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build satellite
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSATELLITE_RELEASE_VERSION="${tag#v}"
          cmake --build build --config Release --target satellite -j "$(nproc)"

      - name: Package (.rpm via CPack)
        run: |
          set -euo pipefail
          mkdir -p dist
          cpack -G RPM -B "${RUNNER_TEMP}/cpack" --config build/CPackConfig.cmake
          cp "${RUNNER_TEMP}"/cpack/satellite-*.x86_64.rpm dist/
          ls -l dist/

      - name: Assert package contents and scriptlets
        run: |
          set -euo pipefail
          rpm -qlp dist/*.rpm
          rpm -qp --requires dist/*.rpm
          rpm -qlp dist/*.rpm | grep -qx '/usr/lib/udev/rules.d/70-satellite-uinput.rules' \
            || { echo "::error::udev rule missing or at the wrong path"; exit 1; }
          rpm -qlp dist/*.rpm | grep -qx '/usr/lib/modules-load.d/satellite.conf' \
            || { echo "::error::modules-load entry missing"; exit 1; }
          rpm -qp --scripts dist/*.rpm | grep -q 'udevadm control' \
            || { echo "::error::rpm carries no udev reload scriptlet"; exit 1; }
          rpm -qp --scripts dist/*.rpm | grep -q 'modprobe uinput' \
            || { echo "::error::rpm carries no modprobe uinput scriptlet"; exit 1; }

      - name: Install the package and launch it
        run: |
          set -euo pipefail
          dnf -y install ./dist/*.rpm
          if ldd /usr/bin/satellite | grep -i 'not found'; then
            echo "::error::installed satellite has unresolved shared libraries"
            exit 1
          fi
          set +e
          satellite >/tmp/launch.log 2>&1 &
          app=$!
          sleep 10
          started=0
          kill -0 "$app" 2>/dev/null && started=1
          if [ "$started" = 1 ]; then
            kill -TERM "$app"
            waited=0
            while [ "$waited" -lt 15 ] && kill -0 "$app" 2>/dev/null; do
              sleep 1
              waited=$((waited + 1))
            done
            kill -0 "$app" 2>/dev/null && kill -KILL "$app"
          fi
          wait "$app"
          rc=$?
          set -e
          cat /tmp/launch.log || true
          if grep -qiE 'error while loading shared libraries|cannot open shared object' /tmp/launch.log; then
            echo "::error::the installed package cannot load its shared libraries"
            exit 1
          fi
          if [ "$started" != 1 ]; then
            echo "::error::satellite exited on its own (${rc}) instead of staying up"
            exit 1
          fi
          if [ "$rc" != 0 ]; then
            echo "::error::satellite did not exit 0 on SIGTERM (got ${rc})"
            exit 1
          fi
          echo "::notice::satellite came up headless, shut down on SIGTERM and exited 0"

      # Stable-name copy for the /releases/latest/download/ permalink.
      - name: Stage stable-name alias
        run: cp dist/satellite-*.x86_64.rpm dist/satellite-x86_64.rpm

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-rpm
          path: dist/*.rpm
          if-no-files-found: error

  # =========================================================================
  # AppImage: every other distro. ubuntu-22.04 because an AppImage's floor is
  # the glibc it linked against, and 22.04's 2.35 covers every supported
  # desktop.
  # =========================================================================
  appimage:
    name: Build AppImage
    needs: [gates, required-secrets]
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libsodium-dev libssl-dev libcurl4-openssl-dev libopus-dev \
            libayatana-appindicator3-dev libgtk-3-dev libnotify-dev \
            file wget

      # The whole recipe (build, linuxdeploy, zsync normalisation, stable-name
      # copy) lives in scripts/build-appimage.sh so a local AppImage and the
      # released one come off the same path (the dish-linux model).
      - name: Build AppImage
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          SATELLITE_VERSION="${tag#v}" bash scripts/build-appimage.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-appimage
          path: stage/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────
  # harden: the shared reusable (scan, SBOMs, SHA256SUMS, cosign keyless).
  # Canonical copy of _release_harden.yml lives in this repo.
  # ─────────────────────────────────────────────────────────────────────
  harden:
    name: Harden artifacts
    needs: [windows, macos, deb, rpm, appimage]
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/_release_harden.yml
    with:
      artifact-pattern: build-*
      product: satellite
      grype-ignore-name-regex: "(?i)^satellite(setup)?$"

  # ─────────────────────────────────────────────────────────────────────
  # SLSA L3 provenance generation. The reusable workflow runs in its own
  # privileged context (id-token: write) and emits an .intoto.jsonl
  # attestation pinned to the harden job's output hashes.
  # ─────────────────────────────────────────────────────────────────────
  provenance:
    name: SLSA L3 provenance
    needs: [harden]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.harden.outputs.hashes }}
      provenance-name: satellite.intoto.jsonl
      upload-assets: false
      # A SHA-pinned call cannot resolve the prebuilt builder's release, so
      # the binary never downloads and the generator dies at exit 127; build
      # it from source instead. 1.0.0 shipped with this flag for a reason.
      compile-generator: true

  # ─────────────────────────────────────────────────────────────────────
  # publish: attach hardened bundle + SLSA provenance to the GitHub
  # Release. Uploaded as a draft and flipped to published once every asset
  # is in place: atomic for the zsync pattern and anyone scripting
  # releases/latest.
  # ─────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to GitHub Releases
    needs: [harden, provenance]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download hardened bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release

      - name: Download SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: release

      - name: Show what we're about to publish
        run: find release -type f -printf '%p\n'

      - name: Upload to GitHub Releases (as draft)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          draft: true
          files: release/**/*
          fail_on_unmatched_files: true

      - name: Flip release from draft to published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          [ "$draft" = "false" ] || { echo "::error::release is still a draft"; exit 1; }

  # ─────────────────────────────────────────────────────────────────────
  # apt-publish: regenerate the APT repository at
  # https://tinkernorth.github.io/satellite/debian and commit to
  # gh-pages. Stable tags only; a prerelease must never reach package
  # managers. Skipped entirely if the GPG signing secret isn't set
  # (e.g. workflow_dispatch from a fork): unsigned repo metadata is worse
  # than no repo at all.
  # ─────────────────────────────────────────────────────────────────────
  apt-publish:
    name: Publish APT repository (gh-pages)
    needs: [publish]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    steps:
      - name: Checkout main (for build scripts)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: main

      - name: Gate on GPG signing secret
        id: gate
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        shell: bash
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_KEY_ID:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY / GPG_KEY_ID not set; skipping APT repo publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install apt-utils + GPG
        if: steps.gate.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils gnupg

      - name: Import signing key
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Download release bundle
        if: steps.gate.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release

      - name: Check out gh-pages branch
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git -C main ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pages
          else
            # First publish: initialize the orphan gh-pages branch with the
            # landing page and gpg.key already in place.
            git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pages
            git -C pages checkout --orphan gh-pages
            git -C pages rm -rf . || true
            cp main/packaging/repo/index.html pages/index.html
          fi
          # Always refresh the landing page from main so README edits propagate.
          cp main/packaging/repo/index.html pages/index.html

      - name: Export public key as gpg.key
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          gpg --batch --yes --armor --export "$GPG_KEY_ID" > pages/gpg.key

      - name: Build APT repo
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          chmod +x main/packaging/repo/build-apt-repo.sh
          main/packaging/repo/build-apt-repo.sh "$(pwd)/pages" "$(pwd)/release"

      - name: Commit + push
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd pages
          git config user.name  'satellite-release-bot'
          git config user.email 'releases@tinkernorth.invalid'
          git add -A
          if git diff --cached --quiet; then
            echo "No APT-repo changes to commit"
          else
            git commit -m "Publish APT repo: ${TAG}"
            git push origin gh-pages
          fi

  # ─────────────────────────────────────────────────────────────────────
  # rpm-publish: same idea as apt-publish, but for the DNF/YUM tree
  # under https://tinkernorth.github.io/satellite/rpm.
  # ─────────────────────────────────────────────────────────────────────
  rpm-publish:
    name: Publish DNF repository (gh-pages)
    needs: [publish, apt-publish]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    steps:
      - name: Checkout main (for build scripts)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: main

      - name: Gate on GPG signing secret
        id: gate
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        shell: bash
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_KEY_ID:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY / GPG_KEY_ID not set; skipping DNF repo publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install createrepo_c + GPG
        if: steps.gate.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends createrepo-c gnupg

      - name: Import signing key
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Download release bundle
        if: steps.gate.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release

      - name: Check out gh-pages branch (apt-publish has already touched it)
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pages

      - name: Build DNF repo
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          REPO_BASE_URL: "https://${{ github.repository_owner }}.github.io/satellite"
        run: |
          chmod +x main/packaging/repo/build-dnf-repo.sh
          main/packaging/repo/build-dnf-repo.sh "$(pwd)/pages" "$(pwd)/release"

      - name: Commit + push
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd pages
          git config user.name  'satellite-release-bot'
          git config user.email 'releases@tinkernorth.invalid'
          git add -A
          if git diff --cached --quiet; then
            echo "No DNF-repo changes to commit"
          else
            git commit -m "Publish DNF repo: ${TAG}"
            git push origin gh-pages
          fi

  # ─────────────────────────────────────────────────────────────────────
  # arch-publish: build the satellite-bin pacman package from the in-tree
  # PKGBUILD (against the assets the publish job just made public) and
  # regenerate the signed pacman repository under
  # https://tinkernorth.github.io/satellite/arch/x86_64.
  #
  # A self-hosted pacman repo, not the AUR: AUR registration is closed, and
  # a binary repo is CI-automatable where AUR pushes need a personal SSH
  # key. packaging/aur/ stays AUR-ready for if/when registration reopens.
  # Chained after rpm-publish because both jobs push gh-pages.
  # ─────────────────────────────────────────────────────────────────────
  arch-publish:
    name: Publish pacman repository (gh-pages)
    needs: [publish, rpm-publish]
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    permissions:
      contents: write
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Gate on GPG signing secret
        id: gate
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_KEY_ID:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY / GPG_KEY_ID not set; skipping pacman repo publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tooling
        if: steps.gate.outputs.skip != 'true'
        run: pacman -Syu --noconfirm git pacman-contrib

      - name: Checkout main (for the PKGBUILD)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: main

      - name: Import signing key
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      # makepkg refuses to run as root, and the container runs as root:
      # build as a throwaway user. updpkgsums re-downloads the sources from
      # the release the publish job just flipped live, so the repo package
      # is built from (and checksummed against) the published bytes, not a
      # parallel local copy. -d skips dependency checks: a -bin package()
      # only copies files, and the depends are runtime-only.
      - name: Build satellite-bin package
        if: steps.gate.outputs.skip != 'true'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          useradd -m builder
          builddir=/home/builder/satellite-bin
          mkdir -p "$builddir"
          cp main/packaging/aur/PKGBUILD main/packaging/aur/satellite-bin.install "$builddir/"
          sed -i "s/^pkgver=.*/pkgver=${version}/; s/^pkgrel=.*/pkgrel=1/" "$builddir/PKGBUILD"
          chown -R builder:builder "$builddir"
          su builder -c "cd '$builddir' && updpkgsums && PACKAGER='satellite-release-bot <releases@tinkernorth.invalid>' makepkg -d --noconfirm"
          ls -l "$builddir"/*.pkg.tar.zst

      - name: Sign package
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          for pkg in /home/builder/satellite-bin/*.pkg.tar.zst; do
            gpg --batch --yes --default-key "$GPG_KEY_ID" --detach-sign "$pkg"
          done

      - name: Check out gh-pages branch (rpm-publish has already touched it)
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pages

      # repo-add emits satellite.db / satellite.files as symlinks to the
      # .tar.gz files; GitHub Pages does not serve symlinks, so replace each
      # with a real copy before committing.
      - name: Build pacman repo
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          repo_dir=pages/arch/x86_64
          mkdir -p "$repo_dir"
          cp /home/builder/satellite-bin/*.pkg.tar.zst /home/builder/satellite-bin/*.pkg.tar.zst.sig "$repo_dir/"
          (
            cd "$repo_dir"
            repo-add --sign --key "$GPG_KEY_ID" satellite.db.tar.gz ./*.pkg.tar.zst
            for link in $(find . -maxdepth 1 -type l); do
              target="$(readlink -f "$link")"
              rm "$link"
              cp "$target" "$link"
            done
          )
          ls -l "$repo_dir"

      - name: Commit + push
        if: steps.gate.outputs.skip != 'true'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd pages
          git config user.name  'satellite-release-bot'
          git config user.email 'releases@tinkernorth.invalid'
          git add -A
          if git diff --cached --quiet; then
            echo "No pacman-repo changes to commit"
          else
            git commit -m "Publish pacman repo: ${TAG}"
            git push origin gh-pages
          fi
