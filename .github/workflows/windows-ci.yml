name: Windows CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe the helper's SDK export of the Sony profiles
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Fetch pinned redistributables
        run: pwsh scripts/fetch-redist.ps1

      - name: Build HIDMaestro helper (dotnet publish exports and checks the copies)
        run: dotnet publish helper/hidmaestro/satellite-hm-helper.csproj -c Release

      - name: Fetch the seven catalog files at the tag
        run: |
          New-Item -ItemType Directory probe-catalog | Out-Null
          $paths = 'sony/dualsense', 'sony/dualsense-composite', 'sony/dualsense-edge', 'sony/dualsense-edge-composite',
                   'sony/dualshock-4-v2', 'sony/dualshock-4-v2-composite', 'nintendo/switch-pro'
          foreach ($p in $paths) {
            $id = Split-Path -Leaf $p
            Invoke-WebRequest "https://raw.githubusercontent.com/hifihedgehog/HIDMaestro/v2.1.0/profiles/$p.json" -OutFile "probe-catalog/$id.json" -UseBasicParsing
          }
          Get-FileHash probe-catalog/*.json -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)" }

      - name: Compare main's published copies with the catalog files
        run: python -I probe/compare_exports.py helper/hidmaestro/bin/Release/net10.0-windows10.0.26100.0/win-x64/publish/hidmaestro-profiles probe-catalog

      - name: Upload the published copies and the catalog files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-export-probe
          path: |
            helper/hidmaestro/bin/Release/net10.0-windows10.0.26100.0/win-x64/publish/hidmaestro-profiles/
            probe-catalog/
          retention-days: 3
          if-no-files-found: error
