name: Security

# PR-time security gates for the satellite repo.
#
# Pulls the shared jobs from satellite/.github/workflows/_security.yml
# (action-pin lint, allowlist-expiry, OSV-Scanner, dependency-review,
# gitleaks). CodeQL lives in codeql.yml because it has its own matrix.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  shared:
    # The reusable's jobs read pull requests (dependency review) and upload
    # SARIF; a workflow grant is the ceiling for what they can ask.
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    # The reusable workflow lives in this repo, so call by local relative path.
    uses: ./.github/workflows/_security.yml
    with:
      # lib/ and vigem/include/ hold no manifest OSV-Scanner can read, so the
      # vendored components are scanned by the upstream commit each pin names.
      osv_lockfile_script: scripts/vendored-osv-lockfile.sh
      osv_config: osv-scanner.toml
      gitleaks_enabled: true
      dependency_review_enabled: true
      action_pin_lint_enabled: true
      allowlist_expiry_enabled: true

  vendored-freshness:
    name: Vendored components <= 90 days old
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check lib/VENDORED.md last-vendored timestamps
        run: bash scripts/check-vendored-freshness.sh
