name: Security

# Security gates on every pull request, every push to main and weekly. The
# jobs live in the shared _security.yml (action-pin lint, allowlist expiry,
# OSV-Scanner, dependency review, gitleaks), byte-identical across the fleet;
# CodeQL lives in codeql.yml because it has its own matrix. The
# vendored-freshness job below is satellite's own.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  shared:
    # Exactly what _security.yml declares; a narrower grant fails the call at startup.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_security.yml
    with:
      osv_scan_paths: .
      # lib/ and vigem/include/ hold no manifest OSV-Scanner can read, so the
      # vendored components are scanned by the upstream commit each pin names.
      osv_lockfile_script: scripts/vendored-osv-lockfile.sh
      # Needs the repository's Dependency graph, which is on.
      dependency_review_enabled: true

  vendored-freshness:
    name: Vendored components <= 90 days old
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check lib/VENDORED.md last-vendored timestamps
        run: bash scripts/check-vendored-freshness.sh
