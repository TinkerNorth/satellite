name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build, test, lint, format (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libsodium-dev libssl-dev libcurl4-openssl-dev libopus-dev \
            libayatana-appindicator3-dev libgtk-3-dev libnotify-dev

      - name: Tool versions
        run: |
          cmake --version
          g++ --version | head -1
          pkg-config --modversion libsodium
          pkg-config --modversion opus
          pkg-config --modversion ayatana-appindicator3-0.1
          pkg-config --modversion gtk+-3.0

      # The gate lives in scripts/check-format.sh, which installs the
      # clang-format scripts/tools.sh pins (hash-checked PyPI wheels), so the
      # three CI workflows and both ci-local scripts run one formatter over
      # one file set.
      - name: clang-format (check only)
        run: bash scripts/check-format.sh

      # Compiler-independent architecture gate: src/core stays std+intra-core+
      # nlohmann-only, and net/adapters never name a platform/<os>/ path.
      - name: Core purity gate
        run: bash scripts/check_core_purity.sh

      # The configure line (Release + warnings-as-errors) lives in
      # CMakePresets.json (preset release) so this workflow, macos-ci.yml,
      # scripts/build.sh and scripts/ci-local.sh run the identical build.
      - name: Configure (preset release, tray enabled)
        run: cmake --preset release

      # Bound -j: bare `-j` oversubscribes and OOM-kills hosted runners (exit 143).
      - name: Build (tray enabled)
        run: cmake --build --preset release -j "$(nproc)"

      - name: Run tests
        run: ctest --preset release

      # The unprivileged ctest pass above skips uinput_smoke (it cannot open
      # the event nodes it creates). This lane runs the binary directly as
      # root so a skip (module missing, node never appearing) fails loudly
      # instead of masquerading as coverage.
      - name: uinput smoke test (real kernel, as root)
        run: |
          sudo modprobe uinput
          sudo ./test_uinput_smoke

      - name: Verify binary links against AppIndicator
        run: |
          test -x satellite
          ldd satellite | grep -E 'ayatana-appindicator|gtk-3' \
            || (echo "tray-enabled build missing AppIndicator/GTK link" && exit 1)

      - name: Upload satellite binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: satellite-linux-x64
          path: satellite
          retention-days: 14
          # A missing binary is a failed lane, not a warning annotation.
          if-no-files-found: error

  headless:
    name: Verify headless fallback build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies (no tray)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libsodium-dev libssl-dev \
            libcurl4-openssl-dev libopus-dev

      - name: Configure (preset release, no tray) and confirm tray is disabled
        run: |
          cmake --preset release 2>&1 | tee cmake-configure.log
          grep -q 'libayatana-appindicator not found' cmake-configure.log \
            || (echo "expected headless fallback message in cmake output" && exit 1)

      - name: Build (headless)
        run: cmake --build --preset release -j "$(nproc)"

      - name: Run tests
        run: ctest --preset release

  fuzz:
    name: Fuzz smoke (decrypt->dispatch robustness, bounded)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies (clang + libFuzzer runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang libclang-rt-18-dev \
            libsodium-dev libssl-dev libcurl4-openssl-dev libopus-dev

      # Not a preset: the fuzz target needs clang, RelWithDebInfo and the
      # sanitizers, a toolchain no other lane uses. Warnings-as-errors as on
      # every preset.
      - name: Configure (clang, SATELLITE_FUZZ=ON)
        run: |
          CC=clang CXX=clang++ cmake -S . -B build-fuzz \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSATELLITE_FUZZ=ON \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          # The lane exists to run the REAL fuzzer; fail loudly if configure
          # fell back to the standalone driver instead of libFuzzer.
          grep -q "^SATELLITE_HAVE_LIBFUZZER:INTERNAL=1$" build-fuzz/CMakeCache.txt \
            || (echo "libFuzzer runtime not detected on the CI toolchain" && exit 1)

      - name: Build fuzz target
        run: cmake --build build-fuzz --target fuzz_receiver_dispatch -j "$(nproc)"

      - name: Corpus regression (each committed seed exactly once)
        run: ./fuzz_receiver_dispatch -runs=0 tests/fuzz/corpus

      # Short bounded run so the lane gates on "malformed datagrams never
      # crash or read out of bounds" without meaningful CI time. New inputs
      # go to a scratch dir; the committed seeds stay read-only.
      - name: Bounded fuzz (10 s wall clock)
        run: |
          mkdir -p /tmp/fuzz-corpus
          ./fuzz_receiver_dispatch -max_total_time=10 -timeout=5 -rss_limit_mb=2048 \
            /tmp/fuzz-corpus tests/fuzz/corpus

  reproducibility:
    name: Build reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A gate, on pushes and PRs alike: two builds of the same tree through
    # the package preset (the one every Linux artifact ships from), from
    # differently named build directories, must produce the same satellite
    # binary. Drift is a failure with the diffoscope report in the log, not a
    # summary line nobody reads.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libsodium-dev libssl-dev \
            libcurl4-openssl-dev libopus-dev \
            libayatana-appindicator3-dev libgtk-3-dev libnotify-dev diffoscope

      # The build directory is named differently each time on purpose: it is
      # the compiler's working directory, and this build (Release, no DSN, so
      # no -g, and nothing generated into the tree) gives the binary no
      # legitimate reason to carry it. A build tree whose name leaks into the
      # output is a defect this job exists to catch, not an input to hold
      # constant.
      - name: Build twice and diff
        shell: bash
        run: |
          set -euo pipefail
          for run in A B; do
            cmake --preset package -B "build-${run}"
            cmake --build "build-${run}" --target satellite -j "$(nproc)"
            mv satellite "satellite-${run}"
            rm -rf "build-${run}"
          done
          if cmp -s satellite-A satellite-B; then
            echo "satellite Linux Release build is bit-identical across two runs and build directories."
            exit 0
          fi
          echo "::error::satellite Linux Release build is NOT bit-identical across two runs and build directories."
          # diffoscope exits 1 when it finds differences, which is the expected
          # outcome here; any other status means it produced no report.
          if diffoscope --no-progress satellite-A satellite-B; then
            echo "::error::cmp reports a difference that diffoscope could not show"
          fi
          exit 1

  # The SDK is only built when a DSN is present, which no PR build has, so
  # this is the one lane that compiles and links the Sentry path before a
  # release tag does. The DSN resolves nowhere; nothing runs it.
  sentry-sdk:
    name: Build with the Sentry SDK (dummy DSN)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libsodium-dev libssl-dev libcurl4-openssl-dev libopus-dev \
            libayatana-appindicator3-dev libgtk-3-dev libnotify-dev

      # The package preset, as the release configures it; CMakeLists.txt
      # scopes warnings-as-errors to this repository's targets, so the SDK's
      # own build keeps its own policy.
      - name: Configure with a DSN that resolves nowhere
        run: |
          cmake --preset package -B build-sentry \
            -DSATELLITE_SENTRY_DSN="https://public@o0.ingest.sentry.invalid/0"

      - name: Build
        run: cmake --build build-sentry --target satellite -j "$(nproc)"

      - name: Verify the SDK is linked and the binary carries debug info
        run: |
          test -x satellite
          syms="$(nm satellite)"
          sections="$(readelf -S satellite)"
          grep -q 'sentry_init' <<<"${syms}" || { echo "::error::sentry_init is not linked"; exit 1; }
          grep -q '\.debug_info' <<<"${sections}" || { echo "::error::no debug info for the symbol upload"; exit 1; }

  # The release's deb and rpm jobs, on every pull request, through the same
  # scripts in the same containers, without the DSN, the symbol upload or the
  # publish: release.yml runs only for a tag that already exists, so a
  # packaging mistake found there is found after the tag is public.
  # scripts/package-in-container.sh runs either lane locally.
  deb:
    name: Package (.deb, Debian 13) and launch it
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 30
    # A container job's default shell is `sh`; every step here assumes bash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build and packaging dependencies
        run: bash scripts/install-package-deps.sh deb

      - name: Build the .deb
        run: bash scripts/build-deb.sh

      - name: Check, install and launch the .deb
        run: bash scripts/check-package.sh deb "$(ls dist/satellite_*.deb)"

      - name: Hand the .deb to the hardening dry run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-deb
          path: dist/*.deb
          retention-days: 3
          if-no-files-found: error

  rpm:
    name: Package (.rpm, Fedora 44) and launch it
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build and packaging dependencies
        run: bash scripts/install-package-deps.sh rpm

      - name: Build the .rpm
        run: bash scripts/build-rpm.sh

      - name: Check, install and launch the .rpm
        run: bash scripts/check-package.sh rpm "$(ls dist/satellite-*.rpm)"

      - name: Hand the .rpm to the hardening dry run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-rpm
          path: dist/*.rpm
          retention-days: 3
          if-no-files-found: error

  # The release's appimage job, on every pull request. Every AppImage up to
  # 2.2.0 shipped without web/. build-appimage.sh asserts the AppImage's own
  # content (the dashboard and the bundled controller database, sizes and
  # SHA-256 as the manifest lists them); the AppImage is then run as
  # macos-ci.yml runs its .app.
  appimage:
    name: AppImage (as the release builds it)
    # ubuntu-22.04 on purpose: an AppImage's floor is the glibc it linked
    # against, and 22.04's 2.35 covers every supported desktop.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: bash scripts/install-package-deps.sh appimage

      - name: Build the AppImage and assert its content
        run: bash scripts/build-appimage.sh

      - name: The AppImage stays up headless
        run: bash scripts/smoke-alive.sh "${RUNNER_TEMP}/appimage-content/squashfs-root/AppRun" 45

      - name: Hand the AppImage to the arch job and the hardening dry run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-appimage
          path: stage/
          retention-days: 3
          if-no-files-found: error

  # The pacman package publish-repos.yml builds and publishes on a tag, on
  # every pull request, around the AppImage the job above built: the same
  # scripts/build-arch-package.sh, then scripts/check-arch-package.sh installs
  # it from a repository signed with a throwaway key and holds the installed
  # AppImage to the packaged bytes and the installed satellite to its
  # start-up line. Nothing is signed with the real key or published. 2.3.0's
  # package shipped an AppImage makepkg had stripped of its payload.
  arch:
    name: Package (pacman, Arch) and launch it
    needs: [appimage]
    runs-on: ubuntu-24.04
    # A dated snapshot, as publish-repos.yml's arch-publish job uses.
    container: archlinux:base-devel-20261108.0.623074
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Install tooling
        run: pacman -Syu --noconfirm git pacman-contrib

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-appimage
          path: appimage

      - name: Build satellite-bin
        run: bash scripts/build-arch-package.sh appimage/satellite-x86_64.AppImage "$(tr -d '[:space:]' < VERSION)" arch-packages

      - name: Install from a signed repository and launch it
        run: bash scripts/check-arch-package.sh arch-packages appimage/satellite-x86_64.AppImage

  # The release's harden job (the shared _release_harden.yml) over the
  # packages this workflow built: Grype, the SBOMs, SHA256SUMS, and a Sigstore
  # bundle per file signed with a throwaway key. Not exercised here: Fulcio,
  # Rekor and the keyless identity (no id-token on a pull request), the
  # code-scanning SARIF upload, the SLSA generator.
  release-dry-run:
    name: Release hardening, dry run (linux)
    needs: [deb, rpm, appimage]
    permissions:
      contents: read
    uses: ./.github/workflows/_release_harden.yml
    with:
      artifact-pattern: build-*
      product: satellite
      dry-run: true
